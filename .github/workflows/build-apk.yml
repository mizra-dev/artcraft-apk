name: Build APK

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "ArtCraft app repo"
        default: "storytold/vectorcraft"
      app_name:
        description: "App name"
        default: "VectorCraft"
      app_id:
        description: "App ID (lowercase, no spaces)"
        default: "com.example.vectorcraft"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      REPO: ${{ inputs.repo }}
      APP_NAME: ${{ inputs.app_name }}
      APP_ID: ${{ inputs.app_id }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Download the web build
        run: |
          mkdir -p dl unz www
          gh release download --repo "$REPO" --pattern '*web*.zip' --dir dl
          for z in dl/*.zip; do unzip -q "$z" -d unz; done
          idx=$(find unz -name index.html | head -n 1)
          cp -r "$(dirname "$idx")"/. www/
          ls www
      - name: Create the Android project
        run: |
          npm init -y
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap init "$APP_NAME" "$APP_ID" --web-dir www
          npx cap add android
          npx cap sync android
      - name: Build the APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app_name }}-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
