name: Build APK

on:
  workflow_dispatch:
    inputs:
      app:
        description: "Which app to build"
        type: choice
        default: vectorcraft
        options:
          - vectorcraft
          - wordcraft
          - pdfcraft
          - photocraft
      autosave_seconds:
        description: "Auto-save every N seconds (0 = off)"
        default: "30"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP: ${{ inputs.app }}
      AUTOSAVE: ${{ inputs.autosave_seconds }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Choose app settings
        run: |
          case "$APP" in
            vectorcraft)
              name="VectorCraft"
              mimes="image/svg+xml,application/illustrator,application/postscript,application/eps,image/x-eps,application/pdf,application/json"
              exts="vectorcraft.json,vectorcraft,svg,svgz,ai,eps,dxf,emf,wmf,af,afdesign,afpub,afphoto,pdf"
              ;;
            wordcraft)
              name="WordCraft"
              mimes="application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/msword,application/vnd.oasis.opendocument.text,application/rtf,text/rtf,text/html,text/markdown,text/x-markdown,text/plain,application/x-tex,text/x-tex"
              exts="docx,doc,odt,rtf,html,md,tex,txt"
              ;;
            pdfcraft)
              name="PdfCraft"
              mimes="application/pdf"
              exts="pdf"
              ;;
            photocraft)
              name="PhotoCraft"
              mimes="image/vnd.adobe.photoshop,image/x-photoshop,application/x-photoshop,application/photoshop,image/png,image/jpeg,image/tiff,image/webp,image/gif,image/bmp,image/x-tga,image/x-icon,image/vnd.microsoft.icon,image/avif,image/x-exr"
              exts="psd,psb,pcraft,png,jpg,jpeg,tif,tiff,webp,gif,bmp,tga,ico,qoi,pnm,ppm,pgm,pbm,exr,hdr,avif"
              ;;
            *)
              echo "Unknown app: $APP"
              exit 1
              ;;
          esac
          {
            echo "REPO=storytold/$APP"
            echo "APP_NAME=$name"
            echo "APP_ID=com.mizra.$APP"
            echo "ICON=$APP"
            echo "MIMES=$mimes"
            echo "EXTS=$exts"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Download the web build
        run: |
          mkdir -p dl unz www
          tag=$(gh release list --repo "$REPO" --limit 1 --json tagName --jq '.[0].tagName')
          gh release download "$tag" --repo "$REPO" --pattern '*web*.zip' --dir dl
          for z in dl/*.zip; do unzip -q "$z" -d unz; done
          idx=$(find unz -name index.html | head -n 1)
          cp -r "$(dirname "$idx")"/. www/
          ls www

      - name: Inject save, open, and share bridge
        run: |
          cat > www/android-save.js <<'EOF'
          (function () {
            var blobs = {};
            var names = {};
            var lastDl = null;
            var extFor = {
              'application/vnd.openxmlformats-officedocument.wordprocessingml.document': 'docx',
              'application/msword': 'doc',
              'application/pdf': 'pdf',
              'text/html': 'html',
              'text/plain': 'txt',
              'text/markdown': 'md',
              'text/x-markdown': 'md',
              'application/rtf': 'rtf',
              'text/rtf': 'rtf',
              'application/vnd.oasis.opendocument.text': 'odt',
              'application/x-tex': 'tex',
              'text/x-tex': 'tex',
              'application/xml': 'xml',
              'text/xml': 'xml',
              'image/png': 'png',
              'image/jpeg': 'jpg',
              'image/webp': 'webp',
              'image/svg+xml': 'svg',
              'application/json': 'json'
            };
            var mimeFor = {
              docx: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document',
              doc: 'application/msword',
              pdf: 'application/pdf',
              html: 'text/html',
              htm: 'text/html',
              txt: 'text/plain',
              md: 'text/markdown',
              rtf: 'application/rtf',
              odt: 'application/vnd.oasis.opendocument.text',
              tex: 'text/x-tex',
              xml: 'application/xml',
              json: 'application/json',
              svg: 'image/svg+xml',
              png: 'image/png',
              jpg: 'image/jpeg',
              jpeg: 'image/jpeg',
              webp: 'image/webp'
            };

            function guessMime(name, fallback) {
              if (fallback && fallback !== 'application/octet-stream') return fallback;
              var m = /\.([a-z0-9]+)$/i.exec(name || '');
              if (m && mimeFor[m[1].toLowerCase()]) return mimeFor[m[1].toLowerCase()];
              return fallback || 'application/octet-stream';
            }

            function ensureName(name, mime) {
              var n = (name || '').trim() || 'document';
              if (n.indexOf('.') === -1) {
                var ext = extFor[mime] || 'docx';
                n += '.' + ext;
              }
              return n;
            }

            function blobToB64(blob, cb) {
              var rd = new FileReader();
              rd.onloadend = function () {
                var data = String(rd.result || '').split(',')[1] || '';
                cb(data);
              };
              rd.readAsDataURL(blob);
            }

            function sendBlob(name, blob) {
              if (!(blob instanceof Blob)) {
                blob = new Blob([blob || ''], { type: 'application/octet-stream' });
              }
              var mime = guessMime(name, blob.type);
              var finalName = ensureName(name, mime);
              blobToB64(blob, function (data) {
                if (window.AndroidSaver) {
                  window.AndroidSaver.save(finalName, mime, data, !!window.__autosaving);
                }
              });
            }

            function sendShareBlob(name, blob, title) {
              if (!(blob instanceof Blob)) {
                blob = new Blob([blob || ''], { type: 'application/octet-stream' });
              }
              var mime = guessMime(name, blob.type);
              var finalName = ensureName(name, mime);
              blobToB64(blob, function (data) {
                if (window.AndroidSaver && window.AndroidSaver.shareFile) {
                  window.AndroidSaver.shareFile(finalName, mime, data, title || '');
                } else if (window.AndroidSaver) {
                  window.AndroidSaver.save(finalName, mime, data, false);
                }
              });
            }

            // 1. Track Object URLs & File objects
            var oCreate = URL.createObjectURL.bind(URL);
            URL.createObjectURL = function (obj) {
              var u = oCreate(obj);
              try {
                if (obj instanceof Blob) {
                  blobs[u] = obj;
                  if (obj.name) names[u] = obj.name;
                }
              } catch (e) {}
              return u;
            };
            var oRevoke = URL.revokeObjectURL.bind(URL);
            URL.revokeObjectURL = function (u) {
              setTimeout(function () { delete blobs[u]; }, 60000);
              return oRevoke(u);
            };

            // 2. Track <a download> attributes and clicks
            function note(a) {
              try {
                var n = a.getAttribute('download');
                if (n !== null) {
                  var h = a.href;
                  if (h) names[h] = n || 'document';
                  lastDl = { name: n || 'document', t: Date.now() };
                }
              } catch (e) {}
            }
            try {
              var A = HTMLAnchorElement.prototype;
              var dd = Object.getOwnPropertyDescriptor(A, 'download');
              var hd = Object.getOwnPropertyDescriptor(A, 'href');
              if (dd && dd.set) {
                Object.defineProperty(A, 'download', {
                  configurable: true,
                  enumerable: dd.enumerable,
                  get: dd.get,
                  set: function (v) { dd.set.call(this, v); note(this); }
                });
              }
              if (hd && hd.set) {
                Object.defineProperty(A, 'href', {
                  configurable: true,
                  enumerable: hd.enumerable,
                  get: hd.get,
                  set: function (v) { hd.set.call(this, v); note(this); }
                });
              }
            } catch (e) {}

            var oSet = Element.prototype.setAttribute;
            Element.prototype.setAttribute = function (k, v) {
              var r = oSet.apply(this, arguments);
              try {
                if (this instanceof HTMLAnchorElement && (k === 'download' || k === 'href')) note(this);
              } catch (e) {}
              return r;
            };

            function saveAnchor(a) {
              var href = a.href || a.getAttribute('href') || '';
              var name = a.getAttribute('download') || names[href] || 'document';
              if (blobs[href]) {
                sendBlob(name, blobs[href]);
                return;
              }
              if (href.indexOf('data:') === 0) {
                var parts = href.split(',');
                var meta = parts[0] || '';
                var body = parts.slice(1).join(',');
                var mimeMatch = /^data:([^;,]+)/i.exec(meta);
                var mime = guessMime(name, mimeMatch ? mimeMatch[1] : 'text/plain');
                var isB64 = /;base64/i.test(meta);
                var b64 = isB64 ? body : btoa(unescape( decodeURIComponent(body) ));
                if (window.AndroidSaver) {
                  window.AndroidSaver.save(ensureName(name, mime), mime, b64, !!window.__autosaving);
                }
                return;
              }
              fetch(href)
                .then(function (r) { return r.blob(); })
                .then(function (bl) { sendBlob(name, bl); });
            }

            window.__nativeDownload = function (url, cd, mime) {
              var name = names[url];
              if (!name && cd) {
                var m = /filename\*?=(?:UTF-8'')?"?([^";]+)"?/i.exec(cd);
                if (m) {
                  try { name = decodeURIComponent(m[1]); } catch (e) { name = m[1]; }
                }
              }
              if (!name && lastDl && Date.now() - lastDl.t < 5000) name = lastDl.name;
              if (!name) name = ensureName('document', mime);
              if (blobs[url]) {
                sendBlob(name, blobs[url]);
                return;
              }
              fetch(url)
                .then(function (r) { return r.blob(); })
                .then(function (bl) { sendBlob(name, bl); });
            };

            var origAnchorClick = HTMLAnchorElement.prototype.click;
            HTMLAnchorElement.prototype.click = function () {
              if (window.AndroidSaver && (this.hasAttribute('download') || (this.href && this.href.indexOf('blob:') === 0))) {
                saveAnchor(this);
                return;
              }
              return origAnchorClick.apply(this, arguments);
            };

            var origDispatch = EventTarget.prototype.dispatchEvent;
            EventTarget.prototype.dispatchEvent = function (ev) {
              if (window.AndroidSaver && ev && ev.type === 'click') {
                if (this instanceof HTMLAnchorElement && (this.hasAttribute('download') || (this.href && this.href.indexOf('blob:') === 0))) {
                  saveAnchor(this);
                  return true;
                }
                if (this instanceof HTMLInputElement && this.type === 'file') {
                  window.__lastFileInput = this;
                  if (window.AndroidSaver.pickFile) {
                    window.AndroidSaver.pickFile();
                    return true;
                  }
                }
              }
              return origDispatch.apply(this, arguments);
            };

            document.addEventListener('click', function (e) {
              var a = e.target && e.target.closest ? e.target.closest('a[download], a[href^="blob:"]') : null;
              if (a && window.AndroidSaver) {
                e.preventDefault();
                e.stopPropagation();
                saveAnchor(a);
                return;
              }
              var inp = e.target && e.target.closest ? e.target.closest('input[type="file"]') : null;
              if (inp && window.AndroidSaver && window.AndroidSaver.pickFile) {
                e.preventDefault();
                e.stopPropagation();
                window.__lastFileInput = inp;
                window.AndroidSaver.pickFile();
              }
            }, true);

            var oOpen = window.open;
            window.open = function (u) {
              if (window.AndroidSaver && typeof u === 'string' && u.indexOf('blob:') === 0 && blobs[u]) {
                var b = blobs[u];
                sendBlob(names[u] || ensureName('document', b.type), b);
                return null;
              }
              return oOpen.apply(window, arguments);
            };

            // 3. Polyfill File System Access API: showSaveFilePicker & showOpenFilePicker
            function makeWritable(suggestedName, fallbackMime) {
              var chunks = [];
              return {
                write: function (d) {
                  if (d && typeof d === 'object' && d.type === 'write' && 'data' in d) d = d.data;
                  if (d !== undefined && d !== null) chunks.push(d);
                  return Promise.resolve();
                },
                seek: function () { return Promise.resolve(); },
                truncate: function () { return Promise.resolve(); },
                close: function () {
                  var mime = guessMime(suggestedName, fallbackMime);
                  var blob = new Blob(chunks, { type: mime });
                  sendBlob(suggestedName, blob);
                  return Promise.resolve();
                },
                abort: function () { return Promise.resolve(); }
              };
            }

            window.showSaveFilePicker = function (opts) {
              opts = opts || {};
              var name = opts.suggestedName || 'document';
              var mime = 'application/octet-stream';
              if (opts.types && opts.types.length && opts.types[0].accept) {
                var acc = opts.types[0].accept;
                var firstMime = Object.keys(acc)[0];
                if (firstMime) {
                  mime = firstMime;
                  var exts = acc[firstMime];
                  if (name.indexOf('.') === -1 && exts && exts.length) {
                    name += exts[0];
                  }
                }
              }
              name = ensureName(name, guessMime(name, mime));
              var handle = {
                kind: 'file',
                name: name,
                getFile: function () {
                  return Promise.resolve(new File([], name, { type: guessMime(name, mime) }));
                },
                createWritable: function () {
                  return Promise.resolve(makeWritable(name, mime));
                },
                queryPermission: function () { return Promise.resolve('granted'); },
                requestPermission: function () { return Promise.resolve('granted'); }
              };
              return Promise.resolve(handle);
            };

            window.showOpenFilePicker = function (opts) {
              return new Promise(function (resolve, reject) {
                window.__openPickerResolve = resolve;
                window.__openPickerReject = reject;
                if (window.AndroidSaver && window.AndroidSaver.pickFile) {
                  window.AndroidSaver.pickFile();
                } else {
                  reject(new Error('File picker unavailable'));
                }
              });
            };

            // 4. Intercept programmatic <input type="file">.click()
            var origInputClick = HTMLInputElement.prototype.click;
            HTMLInputElement.prototype.click = function () {
              if (this.type === 'file' && window.AndroidSaver && window.AndroidSaver.pickFile) {
                window.__lastFileInput = this;
                window.AndroidSaver.pickFile();
                return;
              }
              return origInputClick.apply(this, arguments);
            };

            // 5. Polyfill Web Share API (navigator.share & navigator.canShare)
            var shareFn = function (data) {
              data = data || {};
              return new Promise(function (resolve) {
                if (data.files && data.files.length > 0) {
                  var f = data.files[0];
                  sendShareBlob(f.name || 'document', f, data.title || data.text || '');
                  resolve();
                  return;
                }
                if (data.url && data.url.indexOf('blob:') === 0 && blobs[data.url]) {
                  var b = blobs[data.url];
                  sendShareBlob(names[data.url] || ensureName('document', b.type), b, data.title || '');
                  resolve();
                  return;
                }
                var txt = [data.text, data.url].filter(Boolean).join('\n');
                if (window.AndroidSaver && window.AndroidSaver.shareText) {
                  window.AndroidSaver.shareText(data.title || 'Share', txt || document.title || '');
                }
                resolve();
              });
            };
            var canShareFn = function () { return true; };
            try {
              Object.defineProperty(navigator, 'share', { value: shareFn, configurable: true, writable: true });
              Object.defineProperty(navigator, 'canShare', { value: canShareFn, configurable: true, writable: true });
            } catch (e) {
              navigator.share = shareFn;
              navigator.canShare = canShareFn;
            }

            // 6. Wire window.print() to Android native Print / Save as PDF
            window.print = function () {
              if (window.AndroidSaver && window.AndroidSaver.printPage) {
                window.AndroidSaver.printPage(document.title || 'Document');
              }
            };

            // 7. Handle window.prompt fallback for rfd WASM save dialogs
            var origPrompt = window.prompt ? window.prompt.bind(window) : null;
            window.prompt = function (msg, def) {
              if (def && /\.[a-z0-9]{1,10}$/i.test(def)) return def;
              var res = origPrompt ? origPrompt(msg, def) : def;
              return res !== null && res !== undefined ? res : (def || 'document');
            };

            // 8. Deliver opened files to showOpenFilePicker, <input type="file">, and drop targets
            function b64ToFile(b64, name, mime) {
              var bin = atob(b64);
              var bytes = new Uint8Array(bin.length);
              for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
              var fixedMime = guessMime(name, mime);
              return new File([bytes], name, { type: fixedMime, lastModified: Date.now() });
            }

            function fireDrop(target, type, dt) {
              if (!target) return;
              var ev;
              try {
                ev = new DragEvent(type, { bubbles: true, cancelable: true, dataTransfer: dt });
              } catch (e) {
                ev = new Event(type, { bubbles: true, cancelable: true });
                ev.dataTransfer = dt;
              }
              try {
                if (!ev.dataTransfer) {
                  Object.defineProperty(ev, 'dataTransfer', { value: dt, configurable: true });
                }
              } catch (e) {}
              target.dispatchEvent(ev);
            }

            function feedInput(inp, dt) {
              try {
                Object.defineProperty(inp, 'files', {
                  value: dt.files,
                  configurable: true
                });
              } catch (e) {
                try { inp.files = dt.files; } catch (e2) {}
              }
              inp.dispatchEvent(new Event('input', { bubbles: true }));
              inp.dispatchEvent(new Event('change', { bubbles: true }));
            }

            window.__openPending = function () {
              if (!window.AndroidSaver || !window.AndroidSaver.pendingName) return;
              var name = window.AndroidSaver.pendingName();
              if (!name) return;
              var mime = window.AndroidSaver.pendingMime();
              var file = b64ToFile(window.AndroidSaver.pendingData(), name, mime);

              // A. Resolve showOpenFilePicker if waiting
              if (window.__openPickerResolve) {
                var res = window.__openPickerResolve;
                window.__openPickerResolve = null;
                window.__openPickerReject = null;
                res([{
                  kind: 'file',
                  name: file.name,
                  getFile: function () { return Promise.resolve(file); },
                  createWritable: function () { return Promise.resolve(makeWritable(file.name, file.type)); },
                  queryPermission: function () { return Promise.resolve('granted'); },
                  requestPermission: function () { return Promise.resolve('granted'); }
                }]);
                return;
              }

              var dt = new DataTransfer();
              dt.items.add(file);

              // B. Feed active <input type="file"> if one triggered the picker
              var activeInput = window.__lastFileInput;
              window.__lastFileInput = null;
              if (activeInput) {
                feedInput(activeInput, dt);
                return;
              }

              // C. Feed any <input type="file"> present in the DOM AND fire drop events
              var anyInput = document.querySelector('input[type="file"]');
              if (anyInput) {
                feedInput(anyInput, dt);
              }
              var target = document.querySelector('canvas, [contenteditable="true"], main, #app, #root') || document.body;
              ['dragenter', 'dragover', 'drop'].forEach(function (t) {
                fireDrop(target, t, dt);
              });
            };

            window.__openCancelled = function () {
              if (window.__openPickerReject) {
                var rej = window.__openPickerReject;
                window.__openPickerResolve = null;
                window.__openPickerReject = null;
                rej(new DOMException('The user aborted a request.', 'AbortError'));
              }
            };

            var tries = 0;
            function waitForApp() {
              if (document.querySelector('canvas, [contenteditable="true"], main, #app, #root') || tries++ > 30) {
                setTimeout(window.__openPending, 1500);
              } else {
                setTimeout(waitForApp, 500);
              }
            }
            window.addEventListener('load', waitForApp);
          })();
          EOF
          cat >> www/android-save.js <<'EOF'
          (function () {
            var sec = __AUTOSAVE__;
            if (!sec) return;
            setInterval(function () {
              if (!window.AndroidSaver || !window.AndroidSaver.autoSaveReady()) return;
              window.__autosaving = true;
              var t = document.querySelector('canvas, [contenteditable="true"]') || document.body;
              ['keydown', 'keyup'].forEach(function (type) {
                t.dispatchEvent(new KeyboardEvent(type, {
                  key: 's', code: 'KeyS', keyCode: 83, ctrlKey: true, bubbles: true, cancelable: true
                }));
              });
              setTimeout(function () { window.__autosaving = false; }, 3000);
            }, sec * 1000);
          })();
          EOF
          sed -i "s/__AUTOSAVE__/${AUTOSAVE:-30}/" www/android-save.js
          sed -i 's#</head>#<script src="android-save.js"></script></head>#I' www/index.html

      - name: PhotoCraft startup helpers
        if: ${{ inputs.app == 'photocraft' }}
        run: |
          if [ -d www/snippets ]; then
            mkdir -p www/app/snippets
            cp -r www/snippets/. www/app/snippets/ || true
          fi
          find www -name 'inline0.js'
          if ls www/app/*.part-* > /dev/null 2>&1; then
            for f in www/app/*.part-*; do mv "$f" "$f.bin"; done
            for t in www/index.html www/app/parts.txt www/app/photocraft-web.js www/photocraft-web-boot-*.js; do
              if [ -f "$t" ]; then sed -i -E 's/(\.part-[a-zA-Z0-9]+)/\1.bin/g' "$t"; fi
            done
          fi
          ls www/app
          cat www/app/parts.txt
          cat > www/android-diag.js <<'EOF'
          (function () {
            if (location.search.indexOf('webgl') === -1) {
              location.replace(location.pathname + '?webgl');
              return;
            }
            var logs = [];
            function add(s) {
              logs.push(String(s).slice(0, 240));
              if (logs.length > 30) logs.shift();
            }
            window.addEventListener('error', function (e) {
              var t = e.target;
              if (t && t !== window && (t.src || t.href)) {
                add('LOAD ERROR <' + t.tagName + '> ' + (t.src || t.href));
              } else {
                add('ERROR ' + e.message + ' ' + (e.filename || '') + ':' + (e.lineno || ''));
              }
            }, true);
            window.addEventListener('unhandledrejection', function (e) {
              add('REJECTED ' + (e.reason && (e.reason.message || e.reason)));
            });
            ['error', 'warn', 'log', 'info'].forEach(function (k) {
              var o = console[k];
              console[k] = function () {
                add('console.' + k + ' ' + Array.prototype.join.call(arguments, ' '));
                return o.apply(console, arguments);
              };
            });
            var of = window.fetch;
            window.fetch = function (u) {
              var url = (u && u.url) || u;
              return of.apply(this, arguments).then(function (r) {
                if (!r.ok) add('HTTP ' + r.status + ' ' + url);
                return r;
              }, function (e) {
                add('FETCH FAILED ' + url + ' ' + e);
                throw e;
              });
            };
            setTimeout(function () {
              if (document.body.innerText.indexOf('Loading') === -1) return;
              var gl2 = false;
              try { gl2 = !!document.createElement('canvas').getContext('webgl2'); } catch (e) {}
              var chrome = (navigator.userAgent.match(/Chrome\/[\d.]+/) || ['?'])[0];
              var res = performance.getEntriesByType('resource').map(function (r) {
                return (r.responseStatus || '?') + ' ' + Math.round((r.transferSize || 0) / 1024) + 'KB ' + r.name.replace(location.origin, '');
              });
              var d = document.createElement('pre');
              d.style.cssText = 'position:fixed;left:8px;right:8px;top:8px;max-height:80%;overflow:auto;background:rgba(0,0,0,0.9);color:#ffe27a;font:11px monospace;padding:8px;z-index:99999;white-space:pre-wrap';
              d.textContent = 'Startup log (screenshot this)\n' +
                chrome + ' | WebGL2: ' + gl2 + ' | WebGPU: ' + !!navigator.gpu +
                ' | DecompStream: ' + (typeof DecompressionStream) + '\n' +
                '--- files loaded\n' + (res.slice(-20).join('\n') || '(none)') +
                '\n--- messages\n' + (logs.slice(-20).join('\n') || '(none)');
              document.body.appendChild(d);
            }, 25000);
          })();
          EOF
          sed -i 's#</head>#<script src="android-diag.js"></script></head>#I' www/index.html

      - name: Create the Android project
        run: |
          npm init -y
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap init "$APP_NAME" "$APP_ID" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Inject MainActivity
        run: |
          mkdir -p android/app/src/main/res/xml
          cat > android/app/src/main/res/xml/file_paths.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <external-path name="my_images" path="." />
              <cache-path name="my_cache_images" path="." />
              <files-path name="my_files" path="." />
          </paths>
          EOF

          dir="android/app/src/main/java/$(echo "$APP_ID" | tr . /)"
          mkdir -p "$dir"
          cat > "$dir/MainActivity.java" <<'EOF'
          package __PKG__;

          import android.app.AlertDialog;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.database.Cursor;
          import android.graphics.drawable.GradientDrawable;
          import android.net.Uri;
          import android.os.Bundle;
          import android.print.PrintAttributes;
          import android.print.PrintDocumentAdapter;
          import android.print.PrintManager;
          import android.provider.OpenableColumns;
          import android.util.Base64;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import android.widget.Button;
          import android.widget.FrameLayout;
          import android.widget.Toast;
          import androidx.core.content.FileProvider;
          import com.getcapacitor.BridgeActivity;
          import java.io.ByteArrayOutputStream;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.util.ArrayList;
          import java.util.Arrays;
          import org.json.JSONArray;
          import org.json.JSONObject;

          public class MainActivity extends BridgeActivity {
            private static final int REQ_CREATE = 7101;
            private static final int REQ_OPEN = 7102;
            private static final int RW =
              Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_GRANT_WRITE_URI_PERMISSION;

            private String pName = "";
            private String pMime = "";
            private String pData = "";
            private Uri linkedUri = null;
            private String linkedWebName = null;
            private boolean userSavedOnce = false;
            private boolean forcePicker = false;
            private boolean autoSave = true;
            private String lastHash = "";
            private String saveName = "";
            private String saveMime = "";
            private byte[] saveBytes = null;
            private SharedPreferences prefs;

            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              prefs = getSharedPreferences("files", MODE_PRIVATE);
              autoSave = prefs.getBoolean("autosave", true);
              getBridge().getWebView().addJavascriptInterface(new Saver(), "AndroidSaver");
              getBridge().getWebView().setDownloadListener((url, ua, cd, mime, len) -> {
                final String js = "window.__nativeDownload && window.__nativeDownload("
                  + JSONObject.quote(url) + ","
                  + JSONObject.quote(cd == null ? "" : cd) + ","
                  + JSONObject.quote(mime == null ? "" : mime) + ")";
                runOnUiThread(() -> getBridge().getWebView().evaluateJavascript(js, null));
              });
              addFilesButton();
              Intent in = getIntent();
              if (in != null && Intent.ACTION_VIEW.equals(in.getAction()) && in.getData() != null) {
                loadUri(in.getData());
              }
            }

            @Override
            public void onNewIntent(Intent intent) {
              super.onNewIntent(intent);
              setIntent(intent);
              if (intent != null && Intent.ACTION_VIEW.equals(intent.getAction()) && intent.getData() != null) {
                if (loadUri(intent.getData())) triggerOpen();
              }
            }

            @Override
            public void onActivityResult(int req, int res, Intent data) {
              super.onActivityResult(req, res, data);
              if (req == REQ_OPEN && (res != RESULT_OK || data == null || data.getData() == null)) {
                getBridge().getWebView().post(() ->
                  getBridge().getWebView().evaluateJavascript(
                    "window.__openCancelled && window.__openCancelled()", null));
                return;
              }
              if (res != RESULT_OK || data == null || data.getData() == null) return;
              Uri uri = data.getData();
              if (req == REQ_CREATE && saveBytes != null) {
                try {
                  writeTo(uri, saveBytes);
                  persist(uri);
                  linkedUri = uri;
                  linkedWebName = saveName;
                  userSavedOnce = true;
                  lastHash = hash(saveBytes);
                  String shown = queryName(uri);
                  remember(shown, uri);
                  toast("Saved: " + shown);
                } catch (Exception e) {
                  toast("Save failed: " + e.getMessage());
                }
              } else if (req == REQ_OPEN) {
                if (loadUri(uri)) triggerOpen();
              }
            }

            private void toast(final String msg) {
              runOnUiThread(() -> Toast.makeText(MainActivity.this, msg, Toast.LENGTH_SHORT).show());
            }

            private int dp(int v) {
              return (int) (v * getResources().getDisplayMetrics().density);
            }

            private void triggerOpen() {
              getBridge().getWebView().post(() ->
                getBridge().getWebView().evaluateJavascript(
                  "window.__openPending && window.__openPending()", null));
            }

            private void openFilePicker() {
              Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT);
              i.addCategory(Intent.CATEGORY_OPENABLE);
              i.setType("*/*");
              i.addFlags(RW | Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION);
              startActivityForResult(i, REQ_OPEN);
            }

            private String hash(byte[] b) {
              return b.length + ":" + Arrays.hashCode(b);
            }

            private String queryName(Uri uri) {
              String name = null;
              try {
                Cursor c = getContentResolver().query(uri, null, null, null, null);
                if (c != null) {
                  try {
                    int i = c.getColumnIndex(OpenableColumns.DISPLAY_NAME);
                    if (i >= 0 && c.moveToFirst()) name = c.getString(i);
                  } finally {
                    c.close();
                  }
                }
              } catch (Exception e) {
              }
              if (name == null) name = uri.getLastPathSegment();
              if (name == null) name = "file";
              return name;
            }

            private boolean persist(Uri uri) {
              try {
                getContentResolver().takePersistableUriPermission(uri, RW);
                return true;
              } catch (Exception e) {
              }
              try {
                getContentResolver().takePersistableUriPermission(uri, Intent.FLAG_GRANT_READ_URI_PERMISSION);
                return true;
              } catch (Exception e) {
              }
              return false;
            }

            private void writeTo(Uri uri, byte[] data) throws Exception {
              OutputStream out;
              try {
                out = getContentResolver().openOutputStream(uri, "wt");
              } catch (Exception e) {
                out = getContentResolver().openOutputStream(uri, "w");
              }
              if (out == null) throw new Exception("cannot open file for writing");
              out.write(data);
              out.close();
            }

            private boolean loadUri(Uri uri) {
              try {
                String name = queryName(uri);
                String mime = getContentResolver().getType(uri);
                InputStream in = getContentResolver().openInputStream(uri);
                ByteArrayOutputStream buf = new ByteArrayOutputStream();
                byte[] chunk = new byte[65536];
                int n;
                while ((n = in.read(chunk)) > 0) buf.write(chunk, 0, n);
                in.close();
                pData = Base64.encodeToString(buf.toByteArray(), Base64.NO_WRAP);
                pMime = (mime == null) ? "application/octet-stream" : mime;
                pName = name;
                linkedUri = uri;
                linkedWebName = name;
                userSavedOnce = false;
                lastHash = "";
                if (persist(uri)) remember(name, uri);
                return true;
              } catch (Exception e) {
                toast("Could not open file: " + e.getMessage());
                return false;
              }
            }

            private void doSave(String name, String mime, byte[] data, boolean auto) {
              String h = hash(data);
              if (!forcePicker && linkedUri != null && name.equals(linkedWebName)) {
                if (auto && h.equals(lastHash)) return;
                try {
                  writeTo(linkedUri, data);
                  lastHash = h;
                  if (!auto) {
                    userSavedOnce = true;
                    toast("Saved: " + queryName(linkedUri));
                  }
                  return;
                } catch (Exception e) {
                  linkedUri = null;
                  if (auto) return;
                  toast("Cannot write to the original file. Choose where to save.");
                }
              }
              if (auto) return;
              forcePicker = false;
              saveName = name;
              saveMime = mime;
              saveBytes = data;
              Intent i = new Intent(Intent.ACTION_CREATE_DOCUMENT);
              i.addCategory(Intent.CATEGORY_OPENABLE);
              i.setType(mime != null && !mime.isEmpty() ? mime : "*/*");
              i.putExtra(Intent.EXTRA_TITLE, name);
              i.addFlags(RW | Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION);
              startActivityForResult(i, REQ_CREATE);
            }

            private void doShareFile(String name, String mime, byte[] data, String text) {
              try {
                File outFile = new File(getCacheDir(), name);
                FileOutputStream fos = new FileOutputStream(outFile);
                fos.write(data);
                fos.close();
                Uri uri = FileProvider.getUriForFile(this, getPackageName() + ".fileprovider", outFile);
                Intent i = new Intent(Intent.ACTION_SEND);
                i.setType(mime != null && !mime.isEmpty() ? mime : "*/*");
                i.putExtra(Intent.EXTRA_STREAM, uri);
                if (text != null && !text.isEmpty()) {
                  i.putExtra(Intent.EXTRA_TEXT, text);
                }
                i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                startActivity(Intent.createChooser(i, "Share " + name));
              } catch (Exception e) {
                toast("Share failed, saving instead: " + e.getMessage());
                doSave(name, mime, data, false);
              }
            }

            private void doShareText(String title, String text) {
              try {
                Intent i = new Intent(Intent.ACTION_SEND);
                i.setType("text/plain");
                if (title != null && !title.isEmpty()) {
                  i.putExtra(Intent.EXTRA_SUBJECT, title);
                }
                i.putExtra(Intent.EXTRA_TEXT, text != null ? text : "");
                startActivity(Intent.createChooser(i, title != null && !title.isEmpty() ? title : "Share"));
              } catch (Exception e) {
                toast("Share failed: " + e.getMessage());
              }
            }

            private void doPrint(String jobName) {
              try {
                WebView webView = getBridge().getWebView();
                PrintManager printManager = (PrintManager) getSystemService(Context.PRINT_SERVICE);
                String name = (jobName != null && !jobName.isEmpty()) ? jobName : "Document";
                PrintDocumentAdapter adapter = webView.createPrintDocumentAdapter(name);
                printManager.print(name, adapter, new PrintAttributes.Builder().build());
              } catch (Exception e) {
                toast("Print failed: " + e.getMessage());
              }
            }

            private void remember(String name, Uri uri) {
              try {
                JSONArray old = new JSONArray(prefs.getString("recents", "[]"));
                JSONArray out = new JSONArray();
                JSONObject entry = new JSONObject();
                entry.put("name", name);
                entry.put("uri", uri.toString());
                out.put(entry);
                for (int i = 0; i < old.length() && out.length() < 15; i++) {
                  JSONObject o = old.getJSONObject(i);
                  if (!o.getString("uri").equals(uri.toString())) out.put(o);
                }
                prefs.edit().putString("recents", out.toString()).apply();
              } catch (Exception e) {
              }
            }

            private void removeRecent(String uriStr) {
              try {
                JSONArray old = new JSONArray(prefs.getString("recents", "[]"));
                JSONArray out = new JSONArray();
                for (int i = 0; i < old.length(); i++) {
                  JSONObject o = old.getJSONObject(i);
                  if (!o.getString("uri").equals(uriStr)) out.put(o);
                }
                prefs.edit().putString("recents", out.toString()).apply();
              } catch (Exception e) {
              }
            }

            private void showMenu() {
              final ArrayList<String> names = new ArrayList<>();
              final ArrayList<String> uris = new ArrayList<>();
              try {
                JSONArray arr = new JSONArray(prefs.getString("recents", "[]"));
                for (int i = 0; i < arr.length(); i++) {
                  JSONObject o = arr.getJSONObject(i);
                  names.add(o.getString("name"));
                  uris.add(o.getString("uri"));
                }
              } catch (Exception e) {
              }
              final ArrayList<String> labels = new ArrayList<>();
              labels.add("Open file from storage...");
              labels.add("Save As... (next Save asks where)");
              labels.add("Auto-save: " + (autoSave ? "ON" : "OFF") + " (tap to switch)");
              for (String n : names) labels.add("Recent: " + n);
              new AlertDialog.Builder(this)
                .setTitle("Files")
                .setItems(labels.toArray(new String[0]), (d, which) -> {
                  if (which == 0) {
                    openFilePicker();
                  } else if (which == 1) {
                    forcePicker = true;
                    toast("Press Save in the app to choose a new location");
                  } else if (which == 2) {
                    autoSave = !autoSave;
                    prefs.edit().putBoolean("autosave", autoSave).apply();
                    toast("Auto-save " + (autoSave ? "ON" : "OFF"));
                  } else {
                    String u = uris.get(which - 3);
                    if (loadUri(Uri.parse(u))) {
                      triggerOpen();
                    } else {
                      removeRecent(u);
                    }
                  }
                })
                .show();
            }

            private void addFilesButton() {
              Button b = new Button(this);
              b.setText("Files");
              b.setAllCaps(false);
              b.setTextSize(12);
              b.setTextColor(0xFFFFFFFF);
              GradientDrawable bg = new GradientDrawable();
              bg.setColor(0xB3222222);
              bg.setCornerRadius(dp(20));
              b.setBackground(bg);
              b.setMinWidth(0);
              b.setMinHeight(0);
              b.setPadding(dp(14), dp(8), dp(14), dp(8));
              FrameLayout.LayoutParams lp = new FrameLayout.LayoutParams(
                FrameLayout.LayoutParams.WRAP_CONTENT,
                FrameLayout.LayoutParams.WRAP_CONTENT,
                Gravity.BOTTOM | Gravity.END);
              lp.setMargins(dp(8), dp(8), dp(16), dp(72));
              addContentView(b, lp);
              b.setOnTouchListener(new View.OnTouchListener() {
                float offX, offY, startX, startY;
                boolean moved;

                @Override
                public boolean onTouch(View v, MotionEvent e) {
                  switch (e.getAction()) {
                    case MotionEvent.ACTION_DOWN:
                      offX = v.getX() - e.getRawX();
                      offY = v.getY() - e.getRawY();
                      startX = e.getRawX();
                      startY = e.getRawY();
                      moved = false;
                      return true;
                    case MotionEvent.ACTION_MOVE:
                      if (Math.abs(e.getRawX() - startX) > 15 || Math.abs(e.getRawY() - startY) > 15) moved = true;
                      if (moved) {
                        v.setX(e.getRawX() + offX);
                        v.setY(e.getRawY() + offY);
                      }
                      return true;
                    case MotionEvent.ACTION_UP:
                      if (!moved) showMenu();
                      return true;
                    default:
                      return false;
                  }
                }
              });
            }

            public class Saver {
              @JavascriptInterface
              public String pendingName() { return pName; }

              @JavascriptInterface
              public String pendingMime() { return pMime; }

              @JavascriptInterface
              public String pendingData() {
                String d = pData;
                pData = "";
                pName = "";
                return d;
              }

              @JavascriptInterface
              public boolean autoSaveReady() {
                return autoSave && userSavedOnce && linkedUri != null;
              }

              @JavascriptInterface
              public void pickFile() {
                runOnUiThread(() -> openFilePicker());
              }

              @JavascriptInterface
              public void save(String name, String mime, String b64, boolean auto) {
                final byte[] data = Base64.decode(b64, Base64.DEFAULT);
                final String n = name.replace("/", "_").replace("\\", "_");
                final String m = mime;
                final boolean a = auto;
                runOnUiThread(() -> doSave(n, m, data, a));
              }

              @JavascriptInterface
              public void shareFile(String name, String mime, String b64, String text) {
                final byte[] data = Base64.decode(b64, Base64.DEFAULT);
                final String n = name.replace("/", "_").replace("\\", "_");
                final String m = mime;
                final String t = text;
                runOnUiThread(() -> doShareFile(n, m, data, t));
              }

              @JavascriptInterface
              public void shareText(String title, String text) {
                final String ti = title;
                final String te = text;
                runOnUiThread(() -> doShareText(ti, te));
              }

              @JavascriptInterface
              public void printPage(String jobName) {
                final String j = jobName;
                runOnUiThread(() -> doPrint(j));
              }
            }
          }
          EOF
          sed -i "s/__PKG__/$APP_ID/" "$dir/MainActivity.java"

      - name: Make the app open files
        run: |
          python3 - <<'PY'
          import os
          mf = 'android/app/src/main/AndroidManifest.xml'
          s = open(mf).read()
          mimes = [m.strip() for m in os.environ.get('MIMES', '').split(',') if m.strip()]
          exts = [e.strip().lstrip('.') for e in os.environ.get('EXTS', '').split(',') if e.strip()]
          head = ('<intent-filter>\n'
                  '<action android:name="android.intent.action.VIEW"/>\n'
                  '<category android:name="android.intent.category.DEFAULT"/>\n'
                  '<category android:name="android.intent.category.BROWSABLE"/>\n'
                  '<data android:scheme="content"/>\n'
                  '<data android:scheme="file"/>\n')
          out = ''
          if mimes:
              out += head
              for m in mimes:
                  out += '<data android:mimeType="%s"/>\n' % m
              out += '</intent-filter>\n'
          if exts:
              out += head
              out += '<data android:host="*"/>\n<data android:mimeType="*/*"/>\n'
              for e in exts:
                  for x in {e, e.upper()}:
                      out += '<data android:pathPattern=".*\\\\.%s"/>\n' % x
                      out += '<data android:pathPattern=".*\\\\..*\\\\.%s"/>\n' % x
              out += '</intent-filter>\n'
          s = s.replace('</activity>', out + '</activity>', 1)
          open(mf, 'w').write(s)
          PY
          grep -c "intent-filter" android/app/src/main/AndroidManifest.xml

      - name: Apply custom icon
        run: |
          if [ -f "$ICON.png" ]; then
            mkdir -p assets
            cp "$ICON.png" assets/icon-only.png
            cp "$ICON.png" assets/icon-foreground.png
            cp "$ICON.png" assets/icon-background.png
            npm i -D @capacitor/assets
            npx capacitor-assets generate --android --iconBackgroundColor '#ffffff' --iconBackgroundColorDark '#ffffff'

            mkdir -p android/app/src/main/res/values
            printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#FFFFFF</color>\n</resources>\n' > android/app/src/main/res/values/ic_launcher_background.xml
          else
            echo "No $ICON.png found, keeping default icon"
          fi

      - name: Build the APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app }}-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
