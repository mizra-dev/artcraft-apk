name: Build APK

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "ArtCraft app repo"
        default: "storytold/vectorcraft"
      app_name:
        description: "App name"
        default: "VectorCraft"
      app_id:
        description: "App ID (lowercase, no spaces)"
        default: "com.mizra.vectorcraft"
      icon:
        description: "Icon file name without .png"
        default: "vectorcraft"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      REPO: ${{ inputs.repo }}
      APP_NAME: ${{ inputs.app_name }}
      APP_ID: ${{ inputs.app_id }}
      ICON: ${{ inputs.icon }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Download the web build
        run: |
          mkdir -p dl unz www
          tag=$(gh release list --repo "$REPO" --limit 1 --json tagName --jq '.[0].tagName')
          gh release download "$tag" --repo "$REPO" --pattern '*web*.zip' --dir dl
          for z in dl/*.zip; do unzip -q "$z" -d unz; done
          idx=$(find unz -name index.html | head -n 1)
          cp -r "$(dirname "$idx")"/. www/
          ls www

      - name: Inject simple save bridge
        run: |
          cat > www/android-save.js <<'EOF'
          (function () {
            function save(a) {
              var name = a.getAttribute('download') || 'export';
              fetch(a.href)
                .then(function (r) { return r.blob(); })
                .then(function (b) {
                  var rd = new FileReader();
                  rd.onloadend = function () {
                    var data = String(rd.result).split(',')[1] || '';
                    if (window.AndroidSaver) {
                      window.AndroidSaver.save(name, b.type || 'application/octet-stream', data);
                    }
                  };
                  rd.readAsDataURL(b);
                });
            }
            var origClick = HTMLAnchorElement.prototype.click;
            HTMLAnchorElement.prototype.click = function () {
              if (window.AndroidSaver && this.hasAttribute('download')) {
                save(this);
                return;
              }
              return origClick.apply(this, arguments);
            };
            document.addEventListener('click', function (e) {
              var a = e.target && e.target.closest ? e.target.closest('a[download]') : null;
              if (a && window.AndroidSaver) {
                e.preventDefault();
                save(a);
              }
            }, true);
          })();
          EOF
          sed -i 's#</head>#<script src="android-save.js"></script></head>#' www/index.html

      - name: Create the Android project
        run: |
          npm init -y
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap init "$APP_NAME" "$APP_ID" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Inject Clean MainActivity
        run: |
          dir="android/app/src/main/java/$(echo "$APP_ID" | tr . /)"
          mkdir -p "$dir"
          cat > "$dir/MainActivity.java" <<'EOF'
          package __PKG__;

          import android.content.ContentValues;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.util.Base64;
          import android.webkit.JavascriptInterface;
          import android.widget.Toast;
          import com.getcapacitor.BridgeActivity;
          import java.io.OutputStream;
          import android.net.Uri;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              getBridge().getWebView().addJavascriptInterface(new Saver(), "AndroidSaver");
            }

            private void toast(final String msg) {
              runOnUiThread(() -> Toast.makeText(MainActivity.this, msg, Toast.LENGTH_SHORT).show());
            }

            public class Saver {
              @JavascriptInterface
              public void save(String name, String mime, String b64) {
                try {
                  byte[] data = Base64.decode(b64, Base64.DEFAULT);
                  String safe = name.replace("/", "_").replace("\\", "_");
                  ContentValues v = new ContentValues();
                  v.put(MediaStore.MediaColumns.DISPLAY_NAME, safe);
                  v.put(MediaStore.MediaColumns.MIME_TYPE, mime);
                  v.put(MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS);
                  Uri uri = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, v);
                  if (uri != null) {
                    OutputStream out = getContentResolver().openOutputStream(uri);
                    out.write(data);
                    out.close();
                    toast("Saved to Downloads: " + safe);
                  }
                } catch (Exception e) {
                  toast("Save failed: " + e.getMessage());
                }
              }
            }
          }
          EOF
          sed -i "s/__PKG__/$APP_ID/" "$dir/MainActivity.java"

      - name: Register Default App Intent Filters
        run: |
          python3 - <<'EOF'
          import os

          app_name = os.environ.get("APP_NAME", "").lower()
          manifest_path = "android/app/src/main/AndroidManifest.xml"

          with open(manifest_path, "r", encoding="utf-8") as f:
              content = f.read()

          if 'android:name=".MainActivity"' in content and 'android:exported="true"' not in content:
              content = content.replace('android:name=".MainActivity"', 'android:name=".MainActivity" android:exported="true"')

          if "word" in app_name:
              filters = """
                  <intent-filter>
                      <action android:name="android.intent.action.VIEW" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <category android:name="android.intent.category.BROWSABLE" />
                      <data android:scheme="content" />
                      <data android:mimeType="application/vnd.openxmlformats-officedocument.wordprocessingml.document" />
                      <data android:mimeType="application/msword" />
                      <data android:mimeType="text/plain" />
                      <data android:mimeType="application/rtf" />
                  </intent-filter>"""
          elif "pdf" in app_name:
              filters = """
                  <intent-filter>
                      <action android:name="android.intent.action.VIEW" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <category android:name="android.intent.category.BROWSABLE" />
                      <data android:scheme="content" />
                      <data android:mimeType="application/pdf" />
                  </intent-filter>"""
          elif "photo" in app_name:
              filters = """
                  <intent-filter>
                      <action android:name="android.intent.action.VIEW" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <category android:name="android.intent.category.BROWSABLE" />
                      <data android:scheme="content" />
                      <data android:mimeType="image/*" />
                  </intent-filter>"""
          else:
              filters = """
                  <intent-filter>
                      <action android:name="android.intent.action.VIEW" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <category android:name="android.intent.category.BROWSABLE" />
                      <data android:scheme="content" />
                      <data android:mimeType="image/svg+xml" />
                      <data android:mimeType="image/png" />
                  </intent-filter>"""

          target = "</activity>"
          if target in content:
              new_content = content.replace(target, f"{filters}\n        {target}", 1)
              with open(manifest_path, "w", encoding="utf-8") as f:
                  f.write(new_content)
              print("Clean intent filters injected successfully.")
          else:
              print("Warning: </activity> tag not found.")
          EOF

      - name: Apply custom icon
        run: |
          if [ -f "$ICON.png" ]; then
            mkdir -p assets
            cp "$ICON.png" assets/icon-only.png
            cp "$ICON.png" assets/icon-foreground.png
            cp "$ICON.png" assets/icon-background.png
            npm i -D @capacitor/assets
            npx capacitor-assets generate --android --iconBackgroundColor '#ffffff' --iconBackgroundColorDark '#ffffff'

            mkdir -p android/app/src/main/res/values
            printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#FFFFFF</color>\n</resources>\n' > android/app/src/main/res/values/ic_launcher_background.xml
          else
            echo "No $ICON.png found, keeping default icon"
          fi

      - name: Build the APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app_name }}-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
