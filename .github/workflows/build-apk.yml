name: Build APK

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "ArtCraft app repo"
        default: "storytold/vectorcraft"
      app_name:
        description: "App name"
        default: "VectorCraft"
      app_id:
        description: "App ID (lowercase, no spaces)"
        default: "com.mizra.vectorcraft"
      icon:
        description: "Icon file name without .png"
        default: "vectorcraft"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      REPO: ${{ inputs.repo }}
      APP_NAME: ${{ inputs.app_name }}
      APP_ID: ${{ inputs.app_id }}
      ICON: ${{ inputs.icon }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Download the web build
        run: |
          mkdir -p dl unz www
          tag=$(gh release list --repo "$REPO" --limit 1 --json tagName --jq '.[0].tagName')
          gh release download "$tag" --repo "$REPO" --pattern '*web*.zip' --dir dl
          for z in dl/*.zip; do unzip -q "$z" -d unz; done
          idx=$(find unz -name index.html | head -n 1)
          cp -r "$(dirname "$idx")"/. www/
          ls www

      - name: Inject File Picker & Bridge
        run: |
          cat > www/mizra-bridge.js <<'EOF'
          (function () {
            // Save file picker polyfill for WordCraft & export buttons
            window.showSaveFilePicker = async function (options) {
              const suggestedName = (options && options.suggestedName) ? options.suggestedName : 'document';
              return {
                createWritable: async function () {
                  let chunks = [];
                  return {
                    write: async function (data) { chunks.push(data); },
                    close: async function () {
                      const blob = new Blob(chunks);
                      const reader = new FileReader();
                      reader.onloadend = function () {
                        const b64 = String(reader.result).split(',')[1] || '';
                        if (window.AndroidSaver) {
                          window.AndroidSaver.save(suggestedName, blob.type || 'application/octet-stream', b64);
                        }
                      };
                      reader.readAsDataURL(blob);
                    }
                  };
                }
              };
            };

            function interceptDownload(a) {
              const name = a.getAttribute('download') || 'export';
              fetch(a.href)
                .then(r => r.blob())
                .then(blob => {
                  const reader = new FileReader();
                  reader.onloadend = function () {
                    const b64 = String(reader.result).split(',')[1] || '';
                    if (window.AndroidSaver) {
                      window.AndroidSaver.save(name, blob.type || 'application/octet-stream', b64);
                    }
                  };
                  reader.readAsDataURL(blob);
                });
            }

            const origClick = HTMLAnchorElement.prototype.click;
            HTMLAnchorElement.prototype.click = function () {
              if (window.AndroidSaver && this.hasAttribute('download')) {
                interceptDownload(this);
                return;
              }
              return origClick.apply(this, arguments);
            };

            document.addEventListener('click', function (e) {
              const a = e.target && e.target.closest ? e.target.closest('a[download]') : null;
              if (a && window.AndroidSaver) {
                e.preventDefault();
                interceptDownload(a);
              }
            }, true);

            // Forward incoming files to file inputs or drop handlers
            window.addEventListener('androidFileOpened', function (e) {
              if (!e.detail || !e.detail.data) return;
              try {
                const byteCharacters = atob(e.detail.data);
                const byteNumbers = new Array(byteCharacters.length);
                for (let i = 0; i < byteCharacters.length; i++) {
                  byteNumbers[i] = byteCharacters.charCodeAt(i);
                }
                const byteArray = new Uint8Array(byteNumbers);
                const blob = new Blob([byteArray], { type: e.detail.mime });
                const file = new File([blob], e.detail.name || 'file', { type: e.detail.mime });

                const dt = new DataTransfer();
                dt.items.add(file);

                const inputs = document.querySelectorAll('input[type="file"]');
                if (inputs.length > 0) {
                  inputs[0].files = dt.files;
                  inputs[0].dispatchEvent(new Event('change', { bubbles: true }));
                }

                const target = document.querySelector('canvas') || document.body;
                target.dispatchEvent(new DragEvent('drop', { bubbles: true, cancelable: true, dataTransfer: dt }));
              } catch (err) {
                console.error("Failed to load file:", err);
              }
            });
          })();
          EOF

          sed -i 's#</head>#<script src="mizra-bridge.js"></script></head>#' www/index.html

      - name: Create the Android project
        run: |
          npm init -y
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap init "$APP_NAME" "$APP_ID" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Inject Android Java Bridge
        run: |
          dir="android/app/src/main/java/$(echo "$APP_ID" | tr . /)"
          mkdir -p "$dir"
          cat > "$dir/MainActivity.java" <<'EOF'
          package __PKG__;

          import android.app.Activity;
          import android.content.Intent;
          import android.database.Cursor;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.OpenableColumns;
          import android.util.Base64;
          import android.webkit.JavascriptInterface;
          import android.widget.Toast;
          import androidx.activity.result.ActivityResultLauncher;
          import androidx.activity.result.contract.ActivityResultContracts;
          import com.getcapacitor.BridgeActivity;
          import java.io.ByteArrayOutputStream;
          import java.io.InputStream;
          import java.io.OutputStream;

          public class MainActivity extends BridgeActivity {
            private byte[] pendingSaveData = null;
            private ActivityResultLauncher<Intent> saveFileLauncher;

            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);

              saveFileLauncher = registerForActivityResult(
                new ActivityResultContracts.StartActivityForResult(),
                result -> {
                  if (result.getResultCode() == Activity.RESULT_OK && result.getData() != null) {
                    Uri uri = result.getData().getData();
                    if (uri != null && pendingSaveData != null) {
                      try (OutputStream out = getContentResolver().openOutputStream(uri)) {
                        out.write(pendingSaveData);
                        toast("File saved successfully");
                      } catch (Exception e) {
                        toast("Save error: " + e.getMessage());
                      } finally {
                        pendingSaveData = null;
                      }
                    }
                  }
                }
              );

              getBridge().getWebView().addJavascriptInterface(new Saver(), "AndroidSaver");
              handleIncomingIntent(getIntent());
            }

            @Override
            protected void onNewIntent(Intent intent) {
              super.onNewIntent(intent);
              handleIncomingIntent(intent);
            }

            private void handleIncomingIntent(Intent intent) {
              if (intent != null && Intent.ACTION_VIEW.equals(intent.getAction())) {
                Uri uri = intent.getData();
                if (uri != null) {
                  try {
                    String fileName = "opened_file";
                    try (Cursor cursor = getContentResolver().query(uri, null, null, null, null)) {
                      if (cursor != null && cursor.moveToFirst()) {
                        int idx = cursor.getColumnIndex(OpenableColumns.DISPLAY_NAME);
                        if (idx >= 0) fileName = cursor.getString(idx);
                      }
                    } catch (Exception ignored) {}

                    InputStream in = getContentResolver().openInputStream(uri);
                    ByteArrayOutputStream buffer = new ByteArrayOutputStream();
                    byte[] temp = new byte[4096];
                    int read;
                    while ((read = in.read(temp)) != -1) {
                      buffer.write(temp, 0, read);
                    }
                    in.close();

                    String b64 = Base64.encodeToString(buffer.toByteArray(), Base64.NO_WRAP);
                    String mime = getContentResolver().getType(uri);
                    if (mime == null) mime = "application/octet-stream";
                    final String safeName = fileName;
                    final String safeMime = mime;

                    getBridge().getWebView().postDelayed(() -> {
                      getBridge().getWebView().evaluateJavascript(
                        "window.dispatchEvent(new CustomEvent('androidFileOpened', { detail: { data: '" + b64 + "', mime: '" + safeMime + "', name: '" + safeName + "' } }));",
                        null
                      );
                    }, 1500);
                  } catch (Exception e) {
                    toast("Failed to open file: " + e.getMessage());
                  }
                }
              }
            }

            private void toast(final String msg) {
              runOnUiThread(() -> Toast.makeText(MainActivity.this, msg, Toast.LENGTH_SHORT).show());
            }

            public class Saver {
              @JavascriptInterface
              public void save(String name, String mime, String b64) {
                try {
                  pendingSaveData = Base64.decode(b64, Base64.DEFAULT);
                  Intent intent = new Intent(Intent.ACTION_CREATE_DOCUMENT);
                  intent.addCategory(Intent.CATEGORY_OPENABLE);
                  intent.setType(mime != null ? mime : "application/octet-stream");
                  intent.putExtra(Intent.EXTRA_TITLE, name);
                  saveFileLauncher.launch(intent);
                } catch (Exception e) {
                  toast("Could not open save picker: " + e.getMessage());
                }
              }
            }
          }
          EOF
          sed -i "s/__PKG__/$APP_ID/" "$dir/MainActivity.java"

      - name: Register App-Specific Default Intent Filters
        run: |
          python3 - <<'EOF'
          import os

          app_name = os.environ.get("APP_NAME", "").lower()
          manifest_path = "android/app/src/main/AndroidManifest.xml"

          with open(manifest_path, "r", encoding="utf-8") as f:
              content = f.read()

          # Ensure exported=true is present
          if 'android:name=".MainActivity"' in content and 'android:exported="true"' not in content:
              content = content.replace('android:name=".MainActivity"', 'android:name=".MainActivity" android:exported="true"')

          # Valid, strictly standard Android intent filters
          if "word" in app_name:
              filters = """
                  <intent-filter>
                      <action android:name="android.intent.action.VIEW" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <category android:name="android.intent.category.BROWSABLE" />
                      <data android:scheme="content" />
                      <data android:mimeType="application/vnd.openxmlformats-officedocument.wordprocessingml.document" />
                      <data android:mimeType="application/msword" />
                      <data android:mimeType="text/plain" />
                      <data android:mimeType="application/rtf" />
                  </intent-filter>"""
          elif "vector" in app_name:
              filters = """
                  <intent-filter>
                      <action android:name="android.intent.action.VIEW" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <category android:name="android.intent.category.BROWSABLE" />
                      <data android:scheme="content" />
                      <data android:mimeType="image/svg+xml" />
                      <data android:mimeType="image/png" />
                      <data android:mimeType="application/illustrator" />
                  </intent-filter>"""
          elif "pdf" in app_name:
              filters = """
                  <intent-filter>
                      <action android:name="android.intent.action.VIEW" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <category android:name="android.intent.category.BROWSABLE" />
                      <data android:scheme="content" />
                      <data android:mimeType="application/pdf" />
                  </intent-filter>"""
          elif "photo" in app_name:
              filters = """
                  <intent-filter>
                      <action android:name="android.intent.action.VIEW" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <category android:name="android.intent.category.BROWSABLE" />
                      <data android:scheme="content" />
                      <data android:mimeType="image/*" />
                  </intent-filter>"""
          else:
              filters = """
                  <intent-filter>
                      <action android:name="android.intent.action.VIEW" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <category android:name="android.intent.category.BROWSABLE" />
                      <data android:scheme="content" />
                      <data android:mimeType="*/*" />
                  </intent-filter>"""

          target = "</activity>"
          if target in content:
              new_content = content.replace(target, f"{filters}\n        {target}", 1)
              with open(manifest_path, "w", encoding="utf-8") as f:
                  f.write(new_content)
              print("Clean manifest intent filters successfully registered.")
          EOF

      - name: Apply custom icon
        run: |
          if [ -f "$ICON.png" ]; then
            mkdir -p assets
            cp "$ICON.png" assets/icon-only.png
            cp "$ICON.png" assets/icon-foreground.png
            cp "$ICON.png" assets/icon-background.png
            npm i -D @capacitor/assets
            npx capacitor-assets generate --android --iconBackgroundColor '#ffffff' --iconBackgroundColorDark '#ffffff'

            mkdir -p android/app/src/main/res/values
            printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#FFFFFF</color>\n</resources>\n' > android/app/src/main/res/values/ic_launcher_background.xml
          else
            echo "No $ICON.png found, keeping the default icon"
          fi

      - name: Build the APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app_name }}-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
